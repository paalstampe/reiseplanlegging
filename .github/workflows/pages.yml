# Publiserer siden på GitHub Pages med den felles publiseringen i paalstampe.github.io
# (.github/workflows/publiser.yml, som også stam.pe og byguider bruker):
#   main                -> stam.pe/reiseplanlegging/
#   alle andre grener   -> stam.pe/reiseplanlegging/forhandsvisning/<gren>/
# Kø, rydding av publiseringer som henger og nye forsøk står der.

# Filen må hete pages.yml: ved push til en gren starter publiser.yml den på main ved navn.

name: Publiser

on:
  push:
  delete:
  workflow_dispatch:

jobs:
  publiser:
    uses: paalstampe/paalstampe.github.io/.github/workflows/publiser.yml@main
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
      deployments: read
